name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: pip install ruff black

      - name: ruff
        run: ruff check backend/

      - name: black
        run: black --check backend/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

  # ── Backend unit tests (fast, no OCC/DGL) ─────────────────────────────────────
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: pytest unit
        working-directory: backend
        run: pytest tests/unit -q

  # ── Frontend build ────────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: build
        working-directory: frontend
        run: npm run build

  # ── Integration + retrieval metrics (heavy, nightly or manual) ───────────────
  # Enabled at Phase 4. Requires pythonOCC + DGL + UV-Net weights.
  # integration:
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'workflow_dispatch' || github.event.schedule
  #   steps:
  #     - uses: actions/checkout@v4
  #     ... (uncomment and fill at Phase 4)
